<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="images/valentine.gif" alt="Valentine's Day Image" class="image">
    <h1>Will you be my valentine?</h1>
    <h2>I'm asking nicely pookie bear <3</h2>
    <div class="buttons">
      <button onclick="redirectToYes()">Yes</button>
      <button onclick="redirectToNo()">No</button>
    </div>
  </div>
  <script>
    // Set a session storage flag to indicate the user has started
    sessionStorage.setItem('started', 'true');

    // Function to redirect to the "Yes" page
    function redirectToYes() {
      window.location.href = "yes-page.html";
    }

    // Function to redirect to the "No" page
    function redirectToNo() {
      window.location.href = "no-page.html";
    }
  </script>
</body>
</html>
