<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excuse Me?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="images/excuseme.gif" alt="Excuse Me Image" class="image">
    <h1>Excuse me?</h1>
    <div class="buttons">
      <button onclick="redirectToYes()">Yes</button>
      <button onclick="redirectToNo()">No</button>
    </div>
  </div>
  <script>
    // Check if the user has started the interaction
    if (!sessionStorage.getItem('started')) {
      window.location.href = "index.html";
    }

    // Function to redirect to the "Yes" page
    function redirectToYes() {
      window.location.href = "yes-page.html";
    }

    // Function to redirect to the next "No" page
    function redirectToNo() {
      window.location.href = "no-page-3.html";
    }
  </script>
</body>
</html>
