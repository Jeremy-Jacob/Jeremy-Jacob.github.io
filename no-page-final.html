<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Can't Say No Now!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="images/goober.gif" alt="Goober Image" class="image">
    <h1>You can't say no now, you little goober!</h1>
    <div class="buttons">
      <button onclick="redirectToYes()">Yes</button>
      <button id="noButton" onclick="moveNoButton()">No</button>
    </div>
  </div>
  <script>
    // Function to redirect to the "Yes" page
    function redirectToYes() {
      window.location.href = "yes-page.html";
    }
    
    // Function to move the "No" button randomly
    function moveNoButton() {
      const noButton = document.getElementById('noButton');
      const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
      const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
      noButton.style.position = 'absolute';
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;
    }
  </script>
</body>
</html>
